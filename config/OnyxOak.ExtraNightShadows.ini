; Liberty's Shadows 2.0.3 - default High settings
; Requires the supported FusionFix build and its ordinary ASI loader.
; Keep both Shadow Quality and Night Shadows above Off in Graphics.
[LIBERTY_SHADOWS]
SchemaVersion=3
; 0 disables this mod after restart; game/FusionFix settings remain unchanged.
Enabled=1
; Low: fixed headlights and streetlamps.
; Medium: Low plus supported traffic and emergency lights.
; High: all currently supported enhanced lighting features (recommended).
; Custom: individual settings below are available through the INI only.
Preset=High
GraphicsMenu=1
BasePreset=High
DualHeadlights=1
TaillightShadows=1
TrafficSignalShadows=1
EmergencyLightShadows=1
WorldLighting=1
StreetlightReachFeet=250
HeadlightReachFeet=50

; CUSTOM ONLY. Uncomment these after setting Preset=Custom.
; BasePreset may be Low, Medium or High.
;BasePreset=High
;DualHeadlights=1
;TaillightShadows=1
;TrafficSignalShadows=1
;EmergencyLightShadows=1
;WorldLighting=1
; Reach is in feet: 0..500, in steps of5. 0 uses original reach.
; Increasing reach can increase shadow competition and rendering cost.
; Direct INI edits require a game restart. Graphics offers Off, Low, Medium and High.
;StreetlightReachFeet=250
;HeadlightReachFeet=50

; Support logging and profiling are OFF by default. Fatal startup errors still log.
[SUPPORT]
FrameTimeProfiling151=0
FrameBoundaryProfiling154=0
Logging=0
CpuProfiling=0
MemoryProfiling=0
GpuProfiling=0
ConsumerShadowDiagnostics=0
NativeProducerGateDiagnostics116=0
DiagnosticCounters=0
MaxLogKiB=2048
PoleCasterDiagnostic134=0
PoleStaticAdmission197C=1
PoleDepthRepair197C=1
ArcadePlacement197=1
EffectProducerDiagnostics199C=0
MapContribution198C=0
[DIAGNOSTICS]
ShadowTransitions=0
[LAB]
; Ranking-only experiment on current validated model, traffic and projected sources.
; Known headlight/taillight producers bypass; physical source families are not inferred.
VisibleReceiverRanking133=1

; Existing scenery reach; source brightness and headlight/taillight reach stay unchanged.
StaticConsumerReach136=1
SceneryShadowRetention198A=1
SceneryShadowFade198B=1

; ADDITIONAL LIGHTING CONTROLS (restart after changes)
; PoleStaticAdmission197C + PoleDepthRepair197C: try physical pole geometry
; in an existing selected headlight/streetlight shadow map. No extra maps.
; ArcadePlacement197: move only the two authenticated low arcade sources
; close to their actual emitting fascia. This is not a global height clamp.
; SceneryShadowRetention198A: briefly retain an already available static map.
; SceneryShadowFade198B: blend scenery shadows near the current application
; cutoff. Requires the paired shader; does not fade every map replacement.
; EffectProducerDiagnostics199C: optional bounded fire research capture.
; It does not enable fire shadows. MapContribution198C: separate census.
; Leave both diagnostic options OFF during normal play.
; The compatibility adapter enables automatically for exact official
; VolumetricLights v2.00 if installed. It adds no dependency on that mod.
