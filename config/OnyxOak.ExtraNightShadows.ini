; ============================================================================
; LIBERTY'S SHADOWS - YOUR LIGHTING SETTINGS
; ============================================================================
; Liberty's Shadows 2.0.4 - included lighting settings.
; Starts on High, matching this release's defaults.
;
; HOW TO EDIT
; 1. Close GTA IV. Open this file in Notepad.
; 2. Change the value after =. Leave the setting name and [section] intact.
; 3. Save as OnyxOak.ExtraNightShadows.ini, not .ini.txt, beside the mod's ASI.
; 4. Start the game again. Direct edits to this file require a restart.
;
; A line starting with ; is an explanation, not a setting.
; Switches use 1 = on and 0 = off. Decimal numbers use a dot: 1.5, not 1,5.
; Put explanations on their own ; lines, never after a setting's value.
; Use each setting once. Back up your existing INI before replacing it.
;
; QUICK START
; Want the full experience? The supplied Custom values match High.
; Want a lighter setup? Use Preset=Medium or Preset=Low.
; To edit individual choices, first change Preset=High to Preset=Custom.
;
; IMPORTANT: Low, Medium and High load their own feature/distance choices.
; Individual feature switches and distances below ONLY apply with Custom.
; Choosing a named preset in Graphics can replace your Custom choices.
; The advanced LIGHTING20 values below apply independently of the named preset,
; but only do work when their corresponding lighting features are enabled.
;
; Keep the game's Shadow Quality and Night Shadows enabled in Graphics.
; This file doesn't change Vulkan, resolution or the game's shadow resolution.

[LIBERTY_SHADOWS]

; File format. Leave this at 3.
SchemaVersion=3

; TURN THE MOD ON OR OFF
; 1 enables Liberty's Shadows. 0 disables its lighting changes after restart.
; This does not remove FusionFix or turn off its ordinary lighting.
Enabled=1

; CHOOSE YOUR STARTING EXPERIENCE
; Low    = core headlight and streetlight fixes; fewer extra light families.
; Medium = Low plus supported traffic-signal and emergency-light shadows.
; High   = the full currently supported feature set. Default.
; Custom = use your individual switches and distances below.
; Heavy night scenes can remain demanding even with a powerful PC.
Preset=High

; SHOW LIBERTY'S SHADOWS IN THE GRAPHICS MENU
; 1 shows the mod's quality row. 0 hides that row; the INI still works.
GraphicsMenu=1

; DEFAULTS FOR CUSTOM SETTINGS THAT YOU LEAVE OUT
; Low, Medium or High. Also identifies the preset used when restoring defaults.
; In Custom, the explicit switches below override this base.
; Changing this line alone won't change switches already written below.
BasePreset=High

; ---- YOUR FEATURE CHOICES: Preset must be Custom -----------------------------

; TWO SEPARATE HEADLIGHT SHADOWS
; 1 uses both supported physical front lamps for shadow casting.
; 0 removes the extra dual-lamp feature; it doesn't turn the headlights off.
; Default: 1. Fewer shadow sources may reduce work in traffic.
DualHeadlights=1

; RED TAILLIGHT SHADOWS
; 1 adds shadows from supported rear lights.
; 0 keeps the ordinary rear lighting without this added shadow feature.
; Default: 1. Try 0 if you want to spend less of the shadow budget on rear lights.
TaillightShadows=1

; TRAFFIC-LIGHT SHADOWS
; 1 lets supported active signals cast shadows. 0 disables this added feature.
; Default: 1. This affects shadow casting, not the visible signal bulbs.
TrafficSignalShadows=1

; POLICE / AMBULANCE / EMERGENCY-LIGHT SHADOWS
; 1 enables the supported emergency-light shadow feature. 0 disables it.
; Default: 1. The result can depend on replacement vehicle models.
EmergencyLightShadows=1

; BUILDING, STOREFRONT, NEON AND OTHER SUPPORTED SCENE LIGHTS
; 1 enables the shared world-light enhancement. 0 disables that enhancement.
; Default: 1. This is a useful feature group to disable for a lighter Custom setup.
; The current producers share this switch; windows, neon and floodlights cannot
; yet be switched independently. Stock game lighting remains separate.
WorldLighting=1

; ---- HOW FAR SHADOW LIGHTS ARE CONSIDERED: Custom only -----------------------

; STREET / SCENE SHADOW REACH, IN FEET
; Default High: 250. Low and Medium: 200.
; Allowed: 0 through 500, in steps of 5 (150, 155, 160, etc.).
; 0 uses the original reach behavior; it does NOT turn all shadows off.
; Higher values allow supported sources to compete from farther away.
; This doesn't guarantee that every distant light gets a shadow map.
; Larger distances can increase work, competition and visible switching.
; Try 200 before making large increases. Change only this value, then compare.
StreetlightReachFeet=250

; HEADLIGHT SHADOW REACH, IN FEET
; Default: 50. Allowed: 0 through 500, in steps of 5.
; 0 uses the original reach behavior.
; Controls shadow consideration, not the brightness of the headlight beam.
; Longer reach can be costly. Keep 50 while tuning other options first.
HeadlightReachFeet=50

; ============================================================================
; ADVANCED: HOW THE AVAILABLE SHADOWS ARE SHARED
; ============================================================================
; These change the priorities of eligible lights, not the number of shadow maps.
; They cannot repair misplaced lights, missing pole geometry or hook conflicts.
; Defaults below match the release. Start with small changes.

[LIGHTING20]

; GIVE VISIBLE TRAFFIC SIGNALS MORE SHADOW PRIORITY
; Default: 1.5. Allowed: 1.0 through 4.0.
; 1.0 adds no extra signal preference. Higher values favor relevant signals.
; A stronger signal preference can leave fewer opportunities for other lights.
; This doesn't brighten the signal or extend its physical lighting radius.
SignalShadowPriority=1.5

; FAVOR LIGHTS THAT MATTER TO THE SCENE
; Default: 1.5. Allowed: 0.0 through 4.0.
; Higher values strengthen the scene-contribution ranking.
; 0 restores the older distance/tier ranking; it doesn't turn off shadow culling.
; This is an estimate of scene importance, not a test that a wall blocks a light.
ScenePriorityStrength=1.5

; HOW QUICKLY AN EXISTING SHADOW LOSES PRIORITY
; Default: 450 milliseconds. Allowed: 50 through 1500.
; Higher values soften the loss of priority for still-valid selected sources.
; Lower values let priorities react faster as the scene changes.
; This does NOT fade the actual shadow or keep an extinguished light alive.
; Try 600 for a gentler release; compare whether other lights arrive too late.
ScenePriorityReleaseMs=450

; ============================================================================
; ADVANCED: LIGHT ADDED TO SUPPORTED GLOW-ONLY FIXTURES
; ============================================================================
; Some authored glows have no usable native illumination. The mod can add a
; real point light for supported active glows. The engine calls a glow a corona.
; These Corona settings affect THAT added light, not every neon sign, window,
; headlight, streetlight, fire or explosion. They don't move a source.
; They only apply while the world-light enhancement is enabled.

; ALLOW LIGHT ESTIMATES WHEN A GLOW HAS NO AUTHORED RANGE OR STRENGTH
; Default: 1. Use 0 to require both physical values in the original definition.
; 0 can remove the added illumination/shadows from those incomplete sources.
; The original visible glow is not removed by this switch.
CoronaApproximation=1

; BRIGHTNESS OF THE ADDED GLOW LIGHT
; Default: 1.0. 0.75 is 75% of this light's normal strength; 1.25 is 125%.
; Allowed: 0.001 through 128. Small changes around 1.0 are more useful.
; This scales added illumination, not the sign texture's brightness.
; Lower brightness does not necessarily reduce rendering cost.
CoronaIntensityScale=1.0

; ESTIMATED LIGHT RANGE RELATIVE TO THE ORIGINAL GLOW SIZE
; Default: 12.0. Allowed: 0.001 through 1024.
; Used ONLY when the source has no positive authored physical radius.
; This is a multiplier, not feet. Try 10.0 for a smaller estimated spill.
; Larger spill can affect more surfaces and make lighting more demanding.
CoronaRadiusPerAuthoredSize=12.0

; ESTIMATED STRENGTH WHEN THE ORIGINAL SOURCE HAS NO STRENGTH VALUE
; Default: 1.0. Allowed: 0.001 through 1024.
; This is a fallback before the source's own brightness and the scale above.
; Leave it at 1.0 unless tuning a supported glow-only fixture deliberately.
CoronaFallbackIntensity=1.0

; SMALLEST ESTIMATED LIGHT RADIUS, IN METERS
; Default: 0.1. Allowed: 0.001 through 4096, no higher than the maximum below.
; This bounds estimated radii only; positive authored radii are preserved.
CoronaMinRadius=0.1

; LARGEST ESTIMATED LIGHT RADIUS, IN METERS
; Default: 128.0. Allowed: 0.01 through 4096.
; This is a cap, not the radius assigned to every fixture.
; It bounds estimates only, not valid authored radii or shadow draw distance.
CoronaMaxRadius=128.0

; MAXIMUM ESTIMATED LIGHT STRENGTH
; Default: 64.0. Allowed: 0.001 through 1024.
; Used only where the original physical strength is missing.
; Doesn't cap every native lamp or explosion in the game.
CoronaMaxIntensity=64.0

; ============================================================================
; SUPPORT: GET A LOG IF YOU NEED TO REPORT A PROBLEM
; ============================================================================
; Normal play defaults to no diagnostics. Leave profiling below at 0.

[SUPPORT]

; 2.0.4 defaults: keep these values for the tested release behavior.
; Allows eligible pole geometry into an existing shadow pass; adds no maps.
PoleStaticAdmission197C=1
; Enables the current pole caster repair attempt; not a universal pole fix.
PoleDepthRepair197C=1
; Repositions only the two authenticated low arcade lights.
ArcadePlacement197=1
; Developer fire-effect research only; leave 0. Does not enable fire shadows.
EffectProducerDiagnostics199C=0
; Developer map census only; leave 0.
MapContribution198C=0


; SAVE A SUPPORT LOG
; 0 = no log (default). 1 = general support log. 2 = detailed diagnostic log.
; For a report, try 1, restart, reproduce once, then attach the .log beside the ASI.
; Describe the location, preset, other lighting mods and what you expected.
; Detailed logging is for diagnosis; it can add work and doesn't fix shadows.
Logging=0

; MAXIMUM SUPPORT LOG SIZE, IN KILOBYTES
; Default: 2048 (about 2 MB). Relevant when logging is enabled.
MaxLogKiB=2048

; Developer measurements: keep these off for ordinary play.
FrameTimeProfiling151=0
FrameBoundaryProfiling154=0
CpuProfiling=0
MemoryProfiling=0
GpuProfiling=0
ConsumerShadowDiagnostics=0
NativeProducerGateDiagnostics116=0
DiagnosticCounters=0
PoleCasterDiagnostic134=0

[DIAGNOSTICS]
ShadowTransitions=0

; Compatibility defaults retained from the release; not extra quality levels.
[LAB]
; Indoor bubble: prioritize supported indoor lights up to35ft around Niko.
IndoorShadowBubble212=1

; 2.0.4 defaults: keep these values for the tested release behavior.
; Retains an available scenery shadow briefly to reduce switching.
SceneryShadowRetention198A=1
; Blends supported scenery shadows near the cutoff; uses included shader.
SceneryShadowFade198B=1

VisibleReceiverRanking133=1
StaticConsumerReach136=1

