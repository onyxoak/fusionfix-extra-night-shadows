; Liberty's Shadows - public settings
; Requires the supported FusionFix build and its ordinary ASI loader.
; Keep both Shadow Quality and Night Shadows above Off in Graphics.
[LIBERTY_SHADOWS]
SchemaVersion=3
; 0 disables this mod after restart; game/FusionFix settings remain unchanged.
Enabled=1
; Low: fixed headlights and streetlamps.
; Medium: Low plus supported traffic and emergency lights.
; High: all currently supported enhanced lighting features (recommended).
; Custom: individual settings below are available through the INI only.
Preset=High
GraphicsMenu=1

; CUSTOM ONLY. Uncomment these after setting Preset=Custom.
; BasePreset may be Low, Medium or High.
;BasePreset=High
;DualHeadlights=1
;TaillightShadows=1
;TrafficSignalShadows=1
;EmergencyLightShadows=1
;WorldLighting=1
; Reach is in feet: 0..500, in steps of5. 0 uses original reach.
; Increasing reach can increase shadow competition and rendering cost.
; Direct INI edits require a game restart. Graphics offers Off, Low, Medium and High.
;StreetlightReachFeet=200
;HeadlightReachFeet=50

; Normal play: diagnostics are disabled. CPU batching remains enabled internally.
[SUPPORT]
Logging=0
CpuProfiling=0
MemoryProfiling=0
GpuProfiling=0
ConsumerShadowDiagnostics=0
NativeProducerGateDiagnostics116=0
DiagnosticCounters=0
[DIAGNOSTICS]
ShadowTransitions=0
