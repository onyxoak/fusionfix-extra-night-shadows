; Liberty's Shadows shared settings. Save/menu edits require a game restart.
; Unlisted SUPPORT/LAB settings retain their existing behavior. This file is
; an example, not an installed profile. Native Shadow Quality stays in Graphics.
[LIBERTY_SHADOWS]
SchemaVersion=3
; 0 runs original game/FusionFix behavior with no Liberty lighting hooks/services.
; The optional Graphics menu alone can remain available to enable it for restart.
Enabled=1
; Low: fixed headlights/lampposts. Medium: adds traffic and emergency lights.
; High: all currently supported features. Custom: use the individual fields.
; Max/Ultra/Extreme are no longer offered. Named presets ignore stale fields.
Preset=High
BasePreset=High
; Own guarded Graphics rows. UI failure never disables working lighting.
GraphicsMenu=1
; Custom only: use both physical headlight beams on supported vehicles.
DualHeadlights=1
; Custom only: extra taillight shadows; original illumination stays enabled.
TaillightShadows=1
; Custom only: supported active signal shadows.
TrafficSignalShadows=1
; Custom only: supported emergency/siren shadows.
EmergencyLightShadows=1
; Custom only: coupled model/native projection/glow world-source enhancement.
; These producers share authority and are intentionally one switch.
WorldLighting=1
; Custom only: original reach is0; multiples of5 feet, supported range0..500.
; Longer reach can increase shadow competition and preparation/render work.
StreetlightReachFeet=200
HeadlightReachFeet=50
